<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개발자에게 문의하기 - 쫑긋</title>
  <!-- 🌟 정적 CSS 경로 타임리프 적용 -->
  <link rel="stylesheet" th:href="@{/css/contactStyle.css}">
  
  <!-- '내 반려동물' 버튼 사이즈 및 디자인 고정 스타일 (프론트 반영) -->
  <style>
    .pet-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background-color: #0b8484;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }

    .pet-btn:hover {
      background-color: #086868;
    }
  </style>
</head>

<body>

  <!-- 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo">
      <!-- 🌟 로그인 후 메인인 /main으로 연결 -->
      <a th:href="@{/main}">
        <img th:src="@{/assets/logo.png}" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
    <nav class="nav-links">
      <a th:href="@{/dashboard}">대시보드</a>
      <!-- 리포트 경로 연동 -->
      <a th:href="@{/report}">리포트</a>
    </nav>
    <div class="nav-utils">
      <button class="icon-btn" id="alarmBtn">🔔</button>
      <!-- 🌟 마이페이지 경로 연결 -->
      <a th:href="@{/mypage}" class="icon-btn" id="profileBtn" style="text-decoration: none;">👤</a>
      <!-- 🌟 프론트 최신 반영: 내 반려동물 단일 버튼 적용 -->
      <a th:href="@{/pet-management}" class="pet-btn">내 반려동물</a>
    </div>
  </header>

  <!-- 메인 문의하기 영역 -->
  <main class="contact-container">
    <div class="contact-card">
      <div class="contact-header">
        <h2>개발자에게 문의하기 💬</h2>
        <p>서비스 이용 중 궁금하신 점이나 개선 의견을 남겨주시면 빠르게 답변드리겠습니다.</p>
      </div>

      <form id="contactForm">
        <!-- 이름 -->
        <div class="form-group">
          <label for="userName">이름 <span class="required">*</span></label>
          <input type="text" id="userName" name="userName" class="form-control" placeholder="홍길동" required>
        </div>

        <!-- 이메일 주소 -->
        <div class="form-group">
          <label for="userEmail">이메일 주소 <span class="required">*</span></label>
          <input type="email" id="userEmail" name="userEmail" class="form-control" placeholder="example@email.com" required>
        </div>

        <!-- 휴대폰 번호 -->
        <div class="form-group">
          <label for="userPhone">휴대폰 번호 <span class="required">*</span></label>
          <input type="tel" id="userPhone" name="userPhone" class="form-control" placeholder="010-1234-5678" pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}" required>
        </div>

        <!-- 문의 내용 -->
        <div class="form-group">
          <label for="userMessage">문의 내용 <span class="required">*</span></label>
          <textarea id="userMessage" name="userMessage" class="form-control" placeholder="문의하실 내용을 자세히 작성해주세요." required></textarea>
        </div>

        <!-- 개인정보 수집 동의 -->
        <div class="form-agree">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" required>
            <span>[필수] 개인정보 수집 및 이용에 동의합니다.</span>
          </label>
        </div>

        <!-- 버튼 영역 -->
        <div class="form-actions">
          <!-- 🌟 취소 시 /main으로 이동 -->
          <a th:href="@{/main}" class="btn outline-btn">취소</a>
          <button type="submit" class="btn primary-btn">문의 보내기</button>
        </div>
      </form>
    </div>
  </main>

  <!-- 하단 푸터 -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 쫑긋. All rights reserved.</p>
    </div>
  </footer>

  <!-- 전송 완료 안내 스크립트 (타임리프 URL 연동) -->
  <script th:inline="javascript">
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('문의가 성공적으로 접수되었습니다. 빠르게 확인 후 답변해 드리겠습니다!');
      window.location.href = /*[[@{/main}]]*/ '/main';
    });
  </script>

</body>

</html>
