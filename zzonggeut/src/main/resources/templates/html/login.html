<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 쫑긋</title>
  <!-- 🌟 정적 CSS 경로 타임리프 적용 -->
  <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
</head>

<body>

  <!-- 1. 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo">
      <!-- 🌟 로그인 전 메인인 /으로 연결 -->
      <a th:href="@{/}">
        <img th:src="@{/assets/logo.png}" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
  </header>

  <!-- 2. 로그인 폼 섹션 -->
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>로그인</h2>
        <p>반려동물의 소중한 일상을 함께 확인해보세요.</p>
      </div>

      <!-- 🌟 UserController의 로그인 처리 경로 -->
      <form class="login-form" th:action="@{/api/users/login}" method="post">
        <!-- 아이디 입력 -->
        <div class="form-group">
          <label for="userId">아이디</label>
          <input type="text" id="userId" name="id" placeholder="아이디를 입력하세요" required>
        </div>

        <!-- 비밀번호 입력 -->
        <div class="form-group">
          <label for="userPw">비밀번호</label>
          <input type="password" id="userPw" name="pw" placeholder="비밀번호를 입력하세요" required>
        </div>

        <!-- 로그인 버튼 -->
        <button type="submit" class="submit-btn">로그인</button>
      </form>

      <!-- ID/PW 찾기 및 회원가입 링크 -->
      <div class="login-utils">
        <div class="find-links">
          <!-- 🌟 깔끔한 경로로 연결 -->
          <a th:href="@{/find-id}" class="find-link">아이디 찾기</a>
          <span class="divider">|</span>
          <a th:href="@{/find-pw}" class="find-link">비밀번호 찾기</a>
        </div>
        <a th:href="@{/signup}" class="signup-link">회원가입</a>
      </div>
    </div>
  </main>
  
  <!-- 로그인 실패 시 서버에서 보낸 에러 메시지가 있다면 알럿창 띄우기 -->
  <script th:inline="javascript">
    /*<![CDATA[*/
    var errorMessage = /*[[${errorMessage}]]*/ null;
    if (errorMessage) {
      alert(errorMessage);
    }
    /*]]>*/
  </script>

</body>

</html>
