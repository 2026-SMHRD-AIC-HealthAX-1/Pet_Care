<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디 찾기 - 쫑긋</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background-color: #f7faf9;
      color: #333;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    /* main.html과 동일한 로고 스타일 추가 */
    .logo-img {
      height: 32px;
      width: auto;
      display: block;
    }

    /* 카드 영역 */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
      padding: 40px 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h2 {
      font-size: 26px;
      color: #0b8484;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: #666;
    }

    /* 입력 폼 디자인 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }

    .form-group input {
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background-color: #fafafa;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: #0b8484;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(11, 132, 132, 0.1);
    }

    /* 버튼 */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #0b8484;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .submit-btn:hover {
      background-color: #096d6d;
    }

    /* 하단 링크 영역 */
    .login-utils {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
      font-size: 13px;
    }

    .login-utils a {
      color: #0b8484;
      font-weight: bold;
      text-decoration: none;
    }

    .login-utils a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- 1. 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo">
      <!-- 🌟 로그인 전 메인인 /으로 연결 -->
      <a th:href="@{/}">
        <img th:src="@{/assets/logo.png}" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
  </header>

  <!-- 2. 아이디 찾기 폼 섹션 -->
  <main class="login-container">
    <div class="login-card">
      
      <!-- [경우 1] 아직 아이디를 찾기 전 (입력 폼) -->
      <div th:if="${foundId == null}">
        <div class="login-header">
          <h2>아이디 찾기</h2>
          <p>가입 시 등록한 정보로 아이디를 확인해보세요.</p>
        </div>

        <!-- 🌟 UserController의 경로에 맞게 action 설정 -->
        <form class="login-form" th:action="@{/find-id/process}" method="POST">
          <!-- 이름 입력 -->
          <div class="form-group">
            <label for="userName">이름</label>
            <input type="text" id="userName" name="name" placeholder="이름을 입력하세요" required>
          </div>

          <!-- 전화번호 입력 -->
          <div class="form-group">
            <label for="userPhone">전화번호</label>
            <input type="text" id="userPhone" name="phone" placeholder="'-' 없이 번호만 입력" required>
          </div>

          <!-- 확인 버튼 -->
          <button type="submit" class="submit-btn">아이디 찾기</button>
        </form>

        <!-- 로그인으로 돌아가기 -->
        <div class="login-utils">
          <a th:href="@{/login}">로그인으로 돌아가기</a>
        </div>
      </div>

      <!-- [경우 2] 아이디를 성공적으로 찾은 후 (결과 화면) -->
      <div th:if="${foundId != null}" style="text-align: center;">
        <div class="login-header">
          <h2>아이디 찾기 완료</h2>
          <p>회원님의 정보와 일치하는 아이디입니다.</p>
        </div>

        <!-- 아이디를 보여주는 박스 -->
        <div style="background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 20px; margin: 24px 0;">
          <p style="font-size: 14px; color: #166534; margin-bottom: 6px;">아이디</p>
          <p style="font-size: 18px; font-weight: bold; color: #15803d;" th:text="${foundId}">test@test.com</p>
        </div>

        <!-- 로그인하러 가기 버튼 -->
        <a th:href="@{/login}" class="submit-btn" style="display: block; text-decoration: none; line-height: normal; box-sizing: border-box;">로그인하러 가기</a>

        <!-- 로그인으로 돌아가기 -->
        <div class="login-utils">
          <a th:href="@{/login}">로그인으로 돌아가기</a>
        </div>
      </div>

    </div>
  </main>
  
  <script th:inline="javascript">
    /*<![CDATA[*/
    var errorMessage = /*[[${errorMessage}]]*/ null;
    if (errorMessage) {
      alert(errorMessage);
    }
    /*]]>*/
  </script>

</body>

</html>
