<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관심영역(ROI) 설정 - 쫑긋</title>
  <!-- 🌟 정적 CSS 경로 타임리프 적용 -->
  <link rel="stylesheet" th:href="@{/css/dashboardStyle.css}">
  <style>
    /* roiSelect 전용 레이아웃 및 캔버스 스타일 추가 */
    .roi-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .roi-page-title {
      font-size: 20px;
      font-weight: bold;
      color: #222;
    }

    .roi-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(340px, 1fr);
      gap: 20px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* 카메라 해상도 비율 */
      background-color: #000; /* 여백이 생길 경우 검은색 처리 */
      overflow: hidden;
      border-radius: 8px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* 원본 비율 100% 보존 */
      display: block;
    }

    #roiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .instruction {
      margin-top: 14px;
      background: #eef7f6;
      border: 1px solid #b2dfdb;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #0b8484;
      line-height: 1.5;
      font-weight: 500;
    }

    #sourceupload {
      display: none;
    }

    .form-section {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    .full-input {
      width: 100%;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      padding: 0 12px;
      font-size: 13px;
      color: #333;
      outline: none;
    }

    input[type="file"].full-input {
      padding-top: 8px;
    }

    #roiList {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
      background: #fafafa;
    }

    .empty-msg {
      color: #888;
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
    }

    .roi-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .roi-item:last-child {
      margin-bottom: 0;
    }

    .roi-item:hover {
      background: #f7faf9;
    }

    .roi-item.selected {
      border-color: #0b8484;
      background: #eef7f6;
    }

    .roi-name {
      font-size: 13px;
      font-weight: bold;
      color: #222;
    }

    .roi-coordinate {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }

    .roi-btn-group {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
      margin-top: 24px;
    }

    .json-box {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: #21252b;
      color: #abb2bf;
      border-radius: 8px;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }

    .back-link {
      display: inline-block;
      color: #666;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .back-link:hover {
      color: #0b8484;
    }

    @media (max-width: 900px) {
      .roi-grid {
        grid-template-columns: 1fr;
      }
    }

    /* '내 반려동물' 버튼 디자인 (프론트 반영) */
    .pet-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background-color: #0b8484;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }

    .pet-btn:hover {
      background-color: #086868;
    }
  </style>
</head>

<body>

  <!-- 1. 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo">
      <!-- 🌟 로그인 후 메인인 /main으로 연결 -->
      <a th:href="@{/main}">
        <img th:src="@{/assets/logo.png}" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
    <nav class="nav-links">
      <a th:href="@{/dashboard}">대시보드</a>
      <!-- 리포트 경로 연동 -->
      <a th:href="@{/report}">리포트</a>
    </nav>
    <div class="nav-utils">
      <button class="icon-btn" id="alarmBtn">🔔</button>
      <!-- 🌟 마이페이지 링크 연결 -->
      <a th:href="@{/mypage}" class="icon-btn" id="profileBtn" style="text-decoration: none;">👤</a>
      <!-- 🌟 프론트 최신 반영: 내 반려동물 단일 버튼 적용 -->
      <a th:href="@{/pet-management}" class="pet-btn">내 반려동물</a>
    </div>
  </header>

  <!-- 2. 메인 컨테이너 (중앙 정렬) -->
  <main class="dashboard-container">

    <!-- 🌟 대시보드로 돌아가기 링크 타임리프 적용 -->
    <a th:href="@{/dashboard}" class="back-link">← 대시보드로 돌아가기</a>

    <div class="roi-page-header">
      <h2 class="roi-page-title">🎯 관심영역(ROI) 설정</h2>
      <span class="badge live-badge">카메라: CAM-001</span>
    </div>

    <div class="roi-grid">

      <!-- 좌측: 비디오 & 캔버스 카드 -->
      <section class="dash-card">
        <div class="video-wrapper">
          <video id="video" controls muted autoplay playsinline></video>
          <canvas id="roiCanvas"></canvas>
        </div>
        <div class="instruction">
          💡 영상 위에서 마우스로 드래그하여 영역을 지정하세요. 기존 영역을 클릭하면 선택할 수 있습니다.
        </div>
      </section>

      <!-- 우측: 설정 컨트롤 카드 -->
      <section class="dash-card">
        <div id="sourceupload" class="form-section">
          <label class="form-label">영상 소스 선택/업로드</label>
          <input type="file" id="videoInput" class="full-input" accept="video/*">
        </div>

        <div class="form-section">
          <label class="form-label">지정할 영역 이름</label>
          <select id="roiType" class="full-input">
            <option value="WATER_BOWL">물그릇 (WATER_BOWL)</option>
            <option value="FOOD_BOWL">밥그릇 (FOOD_BOWL)</option>
            <option value="BED">침대 (BED)</option>
          </select>
        </div>

        <div class="form-section">
          <label class="form-label">
            지정된 영역 목록 (<span id="roiCount" class="primary-text font-bold">0</span>개)
          </label>
          <div id="roiList">
            <div class="empty-msg">아직 지정된 영역이 없습니다.</div>
          </div>
        </div>

        <div class="roi-btn-group">
          <button class="btn btn-sm" id="deleteButton">선택 삭제</button>
          <button type="button" class="btn primary-btn" id="saveButton">설정 저장하기</button>
        </div>

        <pre id="jsonBox" class="json-box"></pre>
      </section>

    </div>

  </main>

  <!-- 3. 하단 푸터 -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 쫑긋. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const video = document.getElementById("video");
    const videoInput = document.getElementById("videoInput");
    const canvas = document.getElementById("roiCanvas");
    const ctx = canvas.getContext("2d");

    const roiType = document.getElementById("roiType");
    const roiList = document.getElementById("roiList");
    const roiCount = document.getElementById("roiCount");

    const deleteButton = document.getElementById("deleteButton");
    const saveButton = document.getElementById("saveButton");
    const jsonBox = document.getElementById("jsonBox");

    let rois = [];
    let selectedROI = null;
    let drawing = false;
    let startX = 0;
    let startY = 0;

    let pc = null; // WebRTC 연결 객체

    if (videoInput) {
      videoInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();
      });
    }

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      drawROI();
    }

    window.addEventListener("resize", resizeCanvas);
    video.addEventListener("loadedmetadata", resizeCanvas);

    function getMousePosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height
      };
    }

    canvas.addEventListener("mousedown", function (event) {
      const pos = getMousePosition(event);
      const clickedROI = findROI(pos.x, pos.y);

      if (clickedROI) {
        selectedROI = clickedROI;
        updateROIList();
        drawROI();
        return;
      }

      drawing = true;
      startX = pos.x;
      startY = pos.y;
    });

    canvas.addEventListener("mousemove", function (event) {
      if (!drawing) return;

      const pos = getMousePosition(event);
      drawROI();

      ctx.strokeStyle = "#0b8484";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
      ctx.setLineDash([]);
    });

    canvas.addEventListener("mouseup", function (event) {
      if (!drawing) return;
      drawing = false;

      const pos = getMousePosition(event);
      const x = Math.min(startX, pos.x);
      const y = Math.min(startY, pos.y);
      const width = Math.abs(pos.x - startX);
      const height = Math.abs(pos.y - startY);

      if (width < 10 || height < 10) {
        drawROI();
        return;
      }

      const selectedOption = roiType.options[roiType.selectedIndex];
      const roi = {
        id: Date.now(),
        name: roiType.value,
        label: selectedOption.text,
        x: x,
        y: y,
        width: width,
        height: height
      };

      rois.push(roi);
      selectedROI = roi;
      updateROIList();
      drawROI();
    });

    function findROI(x, y) {
      for (let i = rois.length - 1; i >= 0; i--) {
        const roi = rois[i];
        if (x >= roi.x && x <= roi.x + roi.width && y >= roi.y && y <= roi.y + roi.height) {
          return roi;
        }
      }
      return null;
    }

    function drawROI() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      rois.forEach(function (roi) {
        if (roi === selectedROI) {
          ctx.strokeStyle = "#0b8484";
          ctx.fillStyle = "rgba(11, 132, 132, 0.25)";
        } else {
          ctx.strokeStyle = "#4db6ac";
          ctx.fillStyle = "rgba(77, 182, 172, 0.15)";
        }

        ctx.lineWidth = 2;
        ctx.fillRect(roi.x, roi.y, roi.width, roi.height);
        ctx.strokeRect(roi.x, roi.y, roi.width, roi.height);

        ctx.fillStyle = "#0b8484";
        ctx.font = "bold 13px Pretendard, sans-serif";
        ctx.fillText(roi.label, roi.x + 6, roi.y + 18);
      });
    }

    function updateROIList() {
      roiCount.textContent = rois.length;
      roiList.innerHTML = "";

      if (rois.length === 0) {
        roiList.innerHTML = '<div class="empty-msg">아직 지정된 영역이 없습니다.</div>';
        return;
      }

      rois.forEach(function (roi) {
        const item = document.createElement("div");
        item.className = "roi-item";

        if (roi === selectedROI) {
          item.classList.add("selected");
        }

        const ratio = convertToRatio(roi);

        item.innerHTML = `
          <div>
            <div class="roi-name">${roi.label}</div>
            <div class="roi-coordinate">
              x: ${ratio.x} · y: ${ratio.y} · w: ${ratio.width} · h: ${ratio.height}
            </div>
          </div>
        `;

        item.addEventListener("click", function () {
          selectedROI = roi;
          updateROIList();
          drawROI();
        });

        roiList.appendChild(item);
      });
    }

    function convertToRatio(roi) {
      return {
        x: Number((roi.x / canvas.width).toFixed(6)),
        y: Number((roi.y / canvas.height).toFixed(6)),
        width: Number((roi.width / canvas.width).toFixed(6)),
        height: Number((roi.height / canvas.height).toFixed(6))
      };
    }

    // 영문 코드명을 화면 표시용 라벨로 변환
    function getRoiLabel(name) {
      const labels = {
        "WATER_BOWL": "물그릇 (WATER_BOWL)",
        "FOOD_BOWL": "밥그릇 (FOOD_BOWL)",
        "BED": "침대 (BED)"
      };
      return labels[name] || name;
    }

    // DB 비율(0~1) 좌표를 현재 캔버스 픽셀 좌표로 환산
    function convertFromRatio(dbRoi, cWidth, cHeight) {
      return {
        id: dbRoi.seq,
        name: dbRoi.roi_name,
        label: getRoiLabel(dbRoi.roi_name),
        x: dbRoi.x_start * cWidth,
        y: dbRoi.y_start * cHeight,
        width: dbRoi.width * cWidth,
        height: dbRoi.height * cHeight
      };
    }

    // DB에서 ROI 데이터 조회
    async function loadRoiData() {
      try {
        const response = await fetch("/roiget");
        if (!response.ok) {
          throw new Error("데이터 조회 실패: " + response.status);
        }

        const dbData = await response.json();
        console.log("불러온 ROI 데이터:", dbData);

        if (!dbData || dbData.length === 0) {
          return;
        }

        const cWidth = canvas.width;
        const cHeight = canvas.height;

        rois = dbData.map(function (item) {
          return convertFromRatio(item, cWidth, cHeight);
        });

        updateROIList(); 
        drawROI();

      } catch (error) {
        console.error("ROI 로드 실패:", error);
      }
    }

    // 페이지 진입 시 실행
    window.addEventListener("load", async function () {
      resizeCanvas();
      await loadRoiData();
      await DiaplayVideo();
    });

    // 페이지 이탈 시 스트리밍 종료
    window.addEventListener("beforeunload", function () {
      EndVideo();
    });

    async function DiaplayVideo() {
      if (pc && (pc.connectionState === "connected" || pc.connectionState === "connecting")) {
        console.log("이미 스트리밍이 실행 중입니다.");
        return;
      }

      pc = new RTCPeerConnection();

      pc.ontrack = (event) => {
        const videoElement = document.getElementById("video");
        videoElement.srcObject = event.streams[0];
      };

      pc.addTransceiver('video', { direction: 'recvonly' });

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      try {
        const response = await fetch('http://localhost:8000/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sdp: pc.localDescription.sdp,
            type: pc.localDescription.type,

            // WebRTC 실제 카메라 번호
            camera_num: 0,

            
            // 시연용: 녹화 영상을 LIVE 스트림 소스로 사용
            source_type: "video",

// LIVE AI 분석 메타
            pet_id: "PET-001",
            camera_id: "CAM-001",
            species: "DOG",

            // 현재 화면/DB에서 로드된 ROI를 AI 모델 형식으로 전달
            roi_data: {
              camera_id: "CAM-001",
              roi_areas: rois.map(function (roi) {
                const ratio = convertToRatio(roi);

                return {
                  roi_id: String(roi.id),
                  roi_name: roi.name,
                  roi_type: "RECTANGLE",
                  x: ratio.x,
                  y: ratio.y,
                  width: ratio.width,
                  height: ratio.height
                };
              })
            }
          })
        });

        if (!response.ok) {
          throw new Error(`서버 응답 에러: ${response.status}`);
        }

        const answer = await response.json();
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
        console.log("WebRTC 연결 수립 완료");

      } catch (error) {
        console.error("스트리밍 연결 실패:", error);
      }
    }

    async function EndVideo() {
      const videoElement = document.getElementById("video");

      if (videoElement.srcObject) {
        const stream = videoElement.srcObject;
        stream.getTracks().forEach(track => track.stop());
        videoElement.srcObject = null;
      }

      if (pc) {
        pc.close();
        pc = null;
        console.log("브라우저 WebRTC 세션 종료");
      }

      try {
        await fetch('/api/streaming/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
      } catch (error) {
        console.error("송출 서버 종료 요청 실패:", error);
      }
    }

    video.addEventListener("loadeddata", function () {
      resizeCanvas();
      drawROI();
    });

    deleteButton.addEventListener("click", function () {
      if (!selectedROI) {
        alert("삭제할 영역을 먼저 선택해주세요.");
        return;
      }

      rois = rois.filter(roi => roi !== selectedROI);
      selectedROI = null;
      updateROIList();
      drawROI();
    });

    function createJSON() {
      return {
        camera_id: "CAM-001",
        video: videoInput && videoInput.files[0] ? videoInput.files[0].name : null,
        rois: rois.map(function (roi) {
          const ratio = convertToRatio(roi);
          return {
            id: roi.id,
            name: roi.name,
            x: ratio.x,
            y: ratio.y,
            width: ratio.width,
            height: ratio.height
          };
        })
      };
    }

    saveButton.addEventListener("click", async function (e) {
      if (e) e.preventDefault();

      const data = createJSON();
      console.log("전송할 데이터:", data);

      try {
        const response = await fetch("/roiinsert", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`서버 오류 [${response.status}]: ${errorText}`);
        }

        jsonBox.textContent = JSON.stringify(data, null, 4);
        jsonBox.style.display = "block";

        alert("ROI 설정이 저장되었습니다.");

        // 저장이 완료되면 대시보드나 관련 페이지로 이동
        window.location.href = "/dashboard";

      } catch (error) {
        console.error("전송 실패 원인:", error);
        alert("저장 실패: 콘솔 로그를 확인하세요.");
      }
    });

    resizeCanvas();
  </script>
</body>

</html>
