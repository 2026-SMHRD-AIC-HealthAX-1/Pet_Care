<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 쫑긋</title>
  <link rel="stylesheet" href="../css/loginStyle.css">
</head>

<body>

  <!-- 1. 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo">
      <a href="main.html">
        <img src="/zzonggeut/src/main/resources/static/assets/logo.png" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
  </header>

  <!-- 2. 로그인 폼 섹션 -->
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>로그인</h2>
        <p>반려동물의 소중한 일상을 함께 확인해보세요.</p>
      </div>

      <form class="login-form">
        <!-- 아이디 입력 -->
        <div class="form-group">
          <label for="userId">아이디</label>
          <input type="text" id="userId" placeholder="아이디를 입력하세요" required>
        </div>

        <!-- 비밀번호 입력 -->
        <div class="form-group">
          <label for="userPw">비밀번호</label>
          <input type="password" id="userPw" placeholder="비밀번호를 입력하세요" required>
        </div>

        <!-- 로그인 버튼 -->
        <button type="submit" class="submit-btn">로그인</button>
      </form>

      <!-- ID/PW 찾기 및 회원가입 링크 -->
      <div class="login-utils">
        <div class="find-links">
          <a href="#">아이디 찾기</a>
          <span class="divider">|</span>
          <a href="#">비밀번호 찾기</a>
        </div>
        <a href="signUp.html" class="signup-link">회원가입</a>
      </div>
    </div>
  </main>

</body>

</html>
