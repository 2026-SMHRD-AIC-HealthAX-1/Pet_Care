<!DOCTYPE html>

<head>

  <!-- dashboardStyle.css 연동 -->
  <link rel="stylesheet" href="../css/dashboardStyle.css">
  <style>
    /* roiSelect 전용 레이아웃 및 캔버스 스타일 추가 */
    .roi-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .roi-page-title {
      font-size: 20px;
      font-weight: bold;
      color: #222;
    }

    .roi-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(340px, 1fr);
      gap: 20px;
    }

    /* .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover; /* object-fit: contain; or cover*/
    /* } */

    /*
    #roiCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    } */

	.video-wrapper {
	  position: relative;
	  width: 100%;
	  aspect-ratio: 16 / 9; /* 또는 카메라 해상도 비율 */
	  background-color: #000; /* 여백이 생길 경우 깔끔하게 검은색 처리 */
	  overflow: hidden;
	  border-radius: 8px;
	}
	
	#video {
	  width: 100%;
	  height: 100%;
	  object-fit: contain; /* 원본 비율 100% 보존 */
	  display: block;
	}
	
	#roiCanvas {
	  position: absolute;
	  top: 0;
	  left: 0;
	  width: 100%;
	  height: 100%;
	}

    .instruction {
      margin-top: 14px;
      background: #eef7f6;
      border: 1px solid #b2dfdb;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #0b8484;
      line-height: 1.5;
      font-weight: 500;
    }

	#sourceupload {
  		display: none;
	}
	
    .form-section {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    .full-input {
      width: 100%;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      padding: 0 12px;
      font-size: 13px;
      color: #333;
      outline: none;
    }

    input[type="file"].full-input {
      padding-top: 8px;
    }

    #roiList {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
      background: #fafafa;
    }

    .empty-msg {
      color: #888;
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
    }

    .roi-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .roi-item:last-child {
      margin-bottom: 0;
    }

    .roi-item:hover {
      background: #f7faf9;
    }

    .roi-item.selected {
      border-color: #0b8484;
      background: #eef7f6;
    }

    .roi-name {
      font-size: 13px;
      font-weight: bold;
      color: #222;
    }

    .roi-coordinate {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }

    .roi-btn-group {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
      margin-top: 24px;
    }

    .json-box {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: #21252b;
      color: #abb2bf;
      border-radius: 8px;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }

    .back-link {
      display: inline-block;
      color: #666;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .back-link:hover {
      color: #0b8484;
    }

    @media (max-width: 900px) {
      .roi-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- 1. 상단 네비게이션 바 (dashboard.html 규격 적용) -->
  <header class="navbar">
    <div class="logo">
      <a href="main.html">
        <img src="/zzonggeut/src/main/resources/static/assets/logo.png" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html">대시보드</a>
      <a href="activity-report.html">리포트</a>
    </nav>
    <div class="nav-utils">
      <button class="icon-btn" id="alarmBtn">🔔</button>
      <button class="icon-btn" id="profileBtn">👤</button>
      <select class="pet-select">
        <option value="1">우리 강아지 🐶</option>
        <option value="2">우리 고양이 🐱</option>
      </select>
    </div>
  </header>

  <!-- 2. 메인 컨테이너 (중앙 정렬) -->
  <main class="dashboard-container">

    <a href="dashboard.html" class="back-link">← 대시보드로 돌아가기</a>

    <div class="roi-page-header">
      <h2 class="roi-page-title">🎯 관심영역(ROI) 설정</h2>
      <span class="badge live-badge">카메라: CAM-001</span>
    </div>

    <div class="roi-grid">

      <!-- 좌측: 비디오 & 캔버스 카드 -->
      <section class="dash-card">
        <div class="video-wrapper">
          <video id="video" controls muted autoplay playsinline></video>
          <canvas id="roiCanvas"></canvas>
        </div>
        <div class="instruction">
          💡 영상 위에서 마우스로 드래그하여 영역을 지정하세요. 기존 영역을 클릭하면 선택할 수 있습니다.
        </div>
      </section>

      <!-- 우측: 설정 컨트롤 카드 -->
      <section class="dash-card">
        <div id="sourceupload" class="form-section" >
          <label class="form-label">영상 소스 선택/업로드</label>
          <input type="file" id="videoInput" class="full-input" accept="video/*">
        </div>

        <div class="form-section">
          <label class="form-label">지정할 영역 이름</label>
          <select id="roiType" class="full-input">
            <option value="WATER_BOWL">물그릇 (WATER_BOWL)</option>
            <option value="FOOD_BOWL">밥그릇 (FOOD_BOWL)</option>
            <option value="BED">침대 (BED)</option>
          </select>
        </div>

        <div class="form-section">
          <label class="form-label">
            지정된 영역 목록 (<span id="roiCount" class="primary-text font-bold">0</span>개)
          </label>
          <div id="roiList">
            <div class="empty-msg">아직 지정된 영역이 없습니다.</div>
          </div>
        </div>

        <div class="roi-btn-group">
          <button class="btn btn-sm" id="deleteButton">선택 삭제</button>
          <button type="button" class="btn primary-btn" id="saveButton">설정 저장하기</button>
        </div>

        <pre id="jsonBox" class="json-box"></pre>
      </section>

    </div>

  </main>

  <!-- 3. 하단 푸터 (dashboard.html 규격 적용) -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 쫑긋. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const video = document.getElementById("video");
    const videoInput = document.getElementById("videoInput");
    const canvas = document.getElementById("roiCanvas");
    const ctx = canvas.getContext("2d");

    const roiType = document.getElementById("roiType");
    const roiList = document.getElementById("roiList");
    const roiCount = document.getElementById("roiCount");

    const deleteButton = document.getElementById("deleteButton");
    const saveButton = document.getElementById("saveButton");
    const jsonBox = document.getElementById("jsonBox");

    let rois = [];
    let selectedROI = null;
    let drawing = false;
    let startX = 0;
    let startY = 0;

    let pc = null; // 재연결을 위해 let으로 선언
    
    videoInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      video.src = url;
      video.load();
    });

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      drawROI();
    }

    window.addEventListener("resize", resizeCanvas);
    video.addEventListener("loadedmetadata", resizeCanvas);

    function getMousePosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height
      };
    }

    canvas.addEventListener("mousedown", function (event) {
      const pos = getMousePosition(event);
      const clickedROI = findROI(pos.x, pos.y);

      if (clickedROI) {
        selectedROI = clickedROI;
        updateROIList();
        drawROI();
        return;
      }

      drawing = true;
      startX = pos.x;
      startY = pos.y;
    });

    canvas.addEventListener("mousemove", function (event) {
      if (!drawing) return;

      const pos = getMousePosition(event);
      drawROI();

      ctx.strokeStyle = "#0b8484";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
      ctx.setLineDash([]);
    });

    canvas.addEventListener("mouseup", function (event) {
      if (!drawing) return;
      drawing = false;

      const pos = getMousePosition(event);
      const x = Math.min(startX, pos.x);
      const y = Math.min(startY, pos.y);
      const width = Math.abs(pos.x - startX);
      const height = Math.abs(pos.y - startY);

      if (width < 10 || height < 10) {
        drawROI();
        return;
      }

      const selectedOption = roiType.options[roiType.selectedIndex];
      const roi = {
        id: Date.now(),
        name: roiType.value,
        label: selectedOption.text,
        x: x,
        y: y,
        width: width,
        height: height
      };

      rois.push(roi);
      selectedROI = roi;
      updateROIList();
      drawROI();
    });

    function findROI(x, y) {
      for (let i = rois.length - 1; i >= 0; i--) {
        const roi = rois[i];
        if (x >= roi.x && x <= roi.x + roi.width && y >= roi.y && y <= roi.y + roi.height) {
          return roi;
        }
      }
      return null;
    }

    function drawROI() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      rois.forEach(function (roi) {
        if (roi === selectedROI) {
          ctx.strokeStyle = "#0b8484";
          ctx.fillStyle = "rgba(11, 132, 132, 0.25)";
        } else {
          ctx.strokeStyle = "#4db6ac";
          ctx.fillStyle = "rgba(77, 182, 172, 0.15)";
        }

        ctx.lineWidth = 2;
        ctx.fillRect(roi.x, roi.y, roi.width, roi.height);
        ctx.strokeRect(roi.x, roi.y, roi.width, roi.height);

        ctx.fillStyle = "#0b8484";
        ctx.font = "bold 13px Pretendard, sans-serif";
        ctx.fillText(roi.label, roi.x + 6, roi.y + 18);
      });
    }

    function updateROIList() {
      roiCount.textContent = rois.length;
      roiList.innerHTML = "";

      if (rois.length === 0) {
        roiList.innerHTML = '<div class="empty-msg">아직 지정된 영역이 없습니다.</div>';
        return;
      }

      rois.forEach(function (roi) {
        const item = document.createElement("div");
        item.className = "roi-item";

        if (roi === selectedROI) {
          item.classList.add("selected");
        }

        const ratio = convertToRatio(roi);

        item.innerHTML = `
          <div>
            <div class="roi-name">${roi.label}</div>
            <div class="roi-coordinate">
              x: ${ratio.x} · y: ${ratio.y} · w: ${ratio.width} · h: ${ratio.height}
            </div>
          </div>
        `;

        item.addEventListener("click", function () {
          selectedROI = roi;
          updateROIList();
          drawROI();
        });

        roiList.appendChild(item);
      });
    }

    function convertToRatio(roi) {
      return {
        x: Number((roi.x / canvas.width).toFixed(6)),
        y: Number((roi.y / canvas.height).toFixed(6)),
        width: Number((roi.width / canvas.width).toFixed(6)),
        height: Number((roi.height / canvas.height).toFixed(6))
      };
    }

 // 1. 영문 코드명을 화면 표시용 라벨로 변환해주는 함수
    function getRoiLabel(name) {
      const labels = {
        "WATER_BOWL": "물그릇 (WATER_BOWL)",
        "FOOD_BOWL": "밥그릇 (FOOD_BOWL)",
        "BED": "침대 (BED)"
      };
      return labels[name] || name;
    }

    // 2. DB 비율(0~1) 좌표를 현재 캔버스 픽셀 좌표로 환산하는 함수
    function convertFromRatio(dbRoi, cWidth, cHeight) {
      return {
        id: dbRoi.seq,
        name: dbRoi.roi_name,
        label: getRoiLabel(dbRoi.roi_name), // 라벨 추가 (화면 및 캔버스 텍스트 출력용)
        x: dbRoi.x_start * cWidth,
        y: dbRoi.y_start * cHeight,
        width: dbRoi.width * cWidth,
        height: dbRoi.height * cHeight
      };
    }
    
 // 3. DB에서 ROI 데이터를 조회해 화면에 렌더링하는 함수
    async function loadRoiData() {
      try {
        const response = await fetch("/roiget");
        if (!response.ok) {
          throw new Error("데이터 조회 실패: " + response.status);
        }

        const dbData = await response.json();
        console.log("불러온 ROI 데이터:", dbData);

        if (!dbData || dbData.length === 0) {
          return;
        }

        // 캔버스 크기 기준
        const cWidth = canvas.width;
        const cHeight = canvas.height;

        // DB 데이터로 rois 배열 채우기
        rois = dbData.map(function (item) {
          return convertFromRatio(item, cWidth, cHeight);
        });

        // 실제 선언된 함수 이름으로 정확히 호출
        updateROIList(); 
        drawROI();

      } catch (error) {
        console.error("ROI 로드 실패:", error);
      }
    }

    // 페이지 진입 시 실행 (비디오나 캔버스 크기 계산 후 로드)
    window.addEventListener("load", function () {
      resizeCanvas();
      loadRoiData();
      
      DiaplayVideo();
    });
    
    // 페이지 진입 시 실행 (비디오나 캔버스 크기 계산 후 로드)
    window.addEventListener("beforeunload", function () {
    	
      EndVideo();
      
    });
    
    async function DiaplayVideo() 
    {
    	// 이미 연결되어 있다면 중복 실행 방지
        if (pc && (pc.connectionState === "connected" || pc.connectionState === "connecting")) {
            console.log("이미 스트리밍이 실행 중입니다.");
            return;
        }

        // 1. PeerConnection 인스턴스 생성
        pc = new RTCPeerConnection();

        // 2. 서버로부터 수신된 비디오 트랙을 <video> 태그에 연결
        pc.ontrack = (event) => {
            const videoElement = document.getElementById("video");
            videoElement.srcObject = event.streams[0];
        };

        // 3. 비디오 수신 전용 트랜시버 설정
        pc.addTransceiver('video', { direction: 'recvonly' });

        // 4. Offer 생성 및 LocalDescription 설정
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        try {
            // 5. FastAPI 서버로 Offer 전송
            const response = await fetch('http://localhost:8000/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type,
                    camera_num : 0
                })
            });

            if (!response.ok) {
                throw new Error(`서버 응답 에러: ${response.status}`);
            }

            // 6. Answer 수신 및 RemoteDescription 설정
            const answer = await response.json();
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
            console.log("WebRTC 연결 수립 완료");

        } catch (error) {
            console.error("스트리밍 연결 실패:", error);
            end(); // 오류 발생 시 정리
        }
    }
    
    async function EndVideo() 
    {
    	const videoElement = document.getElementById("video");

        // 1. 브라우저 비디오 화면 및 로컬 트랙 정지
        if (videoElement.srcObject) {
            const stream = videoElement.srcObject;
            stream.getTracks().forEach(track => track.stop());
            videoElement.srcObject = null;
        }

        // 2. 브라우저 측 WebRTC 소켓 종료
        if (pc) {
            pc.close();
            pc = null;
            console.log("브라우저 WebRTC 세션 종료");
        }

        // 3. Spring Boot에 송출 중단 명령 전송
        try {
            const response = await fetch('/api/streaming/stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const result = await response.json();
            console.log("송출 서버 종료 응답:", result);
        } catch (error) {
            console.error("송출 서버 종료 요청 실패:", error);
        }
    }
    
 	// 영상 프레임 데이터가 실제로 들어왔을 때 크기 재동기화
    video.addEventListener("loadeddata", function () {
      resizeCanvas();
      drawROI();
    });
 
    deleteButton.addEventListener("click", function () {
      if (!selectedROI) {
        alert("삭제할 영역을 먼저 선택해주세요.");
        return;
      }

      rois = rois.filter(roi => roi !== selectedROI);
      selectedROI = null;
      updateROIList();
      drawROI();
    });

    function createJSON() 
    {
      return {
        camera_id: "CAM-001",
        video: videoInput.files[0] ? videoInput.files[0].name : null,
        rois: rois.map(function (roi) {
          const ratio = convertToRatio(roi);
          return {
            id: roi.id,
            name: roi.name,
            x: ratio.x,
            y: ratio.y,
            width: ratio.width,
            height: ratio.height
          };
        })
      };
    
    }

    saveButton.addEventListener("click", async function (e) {
    	
    	if (e) e.preventDefault();

    	  const data = createJSON();
    	  console.log("전송할 데이터:", data);

    	  try {
    	    // 스프링의 @PostMapping("/roiinsert")를 비동기 호출
    	    const response = await fetch("/roiinsert", {
    	      method: "POST",
    	      headers: {
    	        "Content-Type": "application/json"
    	      },
    	      body: JSON.stringify(data)
    	    });

    	    if (!response.ok) {
    	      // 서버에서 500 등 에러 응답을 보낸 경우
    	      const errorText = await response.text();
    	      throw new Error(`서버 오류 [${response.status}]: ${errorText}`);
    	    }

    	    // 통신 성공 시 화면 표시
    	    console.log("ROI JSON:", JSON.stringify(data, null, 4));
    	    jsonBox.textContent = JSON.stringify(data, null, 4);
    	    jsonBox.style.display = "block";

    	    alert("ROI 설정이 저장되었습니다.");

    	    // [중요] 저장이 완전히 성공했을 때만 다른 화면(/petmanagement)으로 이동
    	    window.location.href = "/roiselect";

    	  } catch (error) {
    	    console.error("전송 실패 원인:", error);
    	    alert("저장 실패: 콘솔 로그를 확인하세요.");
    	  }
    }); 

    resizeCanvas();
    
  </script>
</body>
