<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쫑긋 - 회원탈퇴</title>
  <link rel="stylesheet" href="../css/mainStyle.css">
  <style>
    .withdraw-container {
      max-width: 500px;
      margin: 60px auto;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .withdraw-header h1 {
      font-size: 24px;
      color: #222222;
      margin-bottom: 12px;
    }
    .withdraw-notice {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 20px;
      margin: 24px 0;
      text-align: left;
    }
    .withdraw-notice p {
      font-size: 15px;
      line-height: 1.6;
      color: #991b1b;
      margin: 0;
      word-break: keep-all;
    }
    .withdraw-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #444444;
    }
    .form-group input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      font-size: 14px;
      color: #555555;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-cancel {
      flex: 1;
      padding: 12px;
      background-color: #f3f4f6;
      color: #4b5563;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-withdraw {
      flex: 1;
      padding: 12px;
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-withdraw:hover {
      background-color: #dc2626;
    }
  </style>
</head>

<body>

  <!-- 1. 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo">
      <a href="main.html">
        <img src="../assets/logo.png" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html">대시보드</a>
      <a href="activity-report.html">리포트</a>
    </nav>
    <div class="nav-utils">
      <button class="icon-btn" id="alarmBtn">🔔</button>
      <a href="myPage.html" class="icon-btn" id="profileBtn" style="text-decoration: none;">👤</a>
      <a href="petManagement.html" class="btn primary-btn">내 반려동물</a>
    </div>
  </header>

  <main>
    <div class="withdraw-container">
      <div class="withdraw-header">
        <h1>회원탈퇴</h1>
      </div>

      <!-- 안내 문구 박스 -->
      <div class="withdraw-notice">
        <p>⚠️ 탈퇴 시 계정 및 이용 기록은 모두 삭제되며 복구할 수 없습니다. 관련 법령에 따라 일부 정보는 일정 기간 보관 후 파기됩니다.</p>
      </div>

      <!-- 비밀번호 확인 폼 -->
      <form class="withdraw-form" action="#" method="POST">
        <div class="form-group">
          <label for="password">비밀번호 확인</label>
          <input type="password" id="password" name="password" placeholder="현재 비밀번호를 입력해 주세요" required>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="confirmCheck" required>
          <label for="confirmCheck">위 안내 사항을 모두 확인하였으며, 탈퇴에 동의합니다.</label>
        </div>

        <div class="button-group">
          <a href="myPage.html" class="btn-cancel">취소</a>
          <button type="submit" class="btn-withdraw">탈퇴하기</button>
        </div>
      </form>
    </div>
  </main>

  <!-- 4. 하단 푸터 영역 -->
  <footer class="footer">
    <div class="footer-top">
      <div class="footer-brand">
        <a href="main.html">
          <img src="../assets/logo.png" alt="쫑긋 로고" class="footer-logo-img">
        </a>
        <p>평소를 알고, 변화를 알려주는 펫케어 서비스</p>
      </div>
      <div class="footer-links">
        <div class="col">
          <h4>서비스</h4>
          <a href="#">서비스 소개</a>
          <a href="#">서비스 가입</a>
          <a href="#">요금 안내</a>
        </div>
        <div class="col">
          <h4>고객센터</h4>
          <a href="notice.html">공지사항</a>
          <a href="#">자주 묻는 질문</a>
          <a href="contact.html">문의하기</a>
        </div>
        <div class="col">
          <h4>기타</h4>
          <a href="privacy.html">개인정보처리방침</a>
          <a href="use.html">이용약관</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2026 쫑긋. All rights reserved.</p>
    </div>
  </footer>

</body>

</html>
