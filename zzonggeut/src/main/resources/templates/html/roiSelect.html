<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관심영역(ROI) 설정 - 쫑긋</title>
  <!-- dashboardStyle.css 연동 -->
  <link rel="stylesheet" href="../css/dashboardStyle.css">
  <style>
    /* roiSelect 전용 레이아웃 및 캔버스 스타일 추가 */
    .roi-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .roi-page-title {
      font-size: 20px;
      font-weight: bold;
      color: #222;
    }

    .roi-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(340px, 1fr);
      gap: 20px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    #roiCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .instruction {
      margin-top: 14px;
      background: #eef7f6;
      border: 1px solid #b2dfdb;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #0b8484;
      line-height: 1.5;
      font-weight: 500;
    }

    .form-section {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    .full-input {
      width: 100%;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      padding: 0 12px;
      font-size: 13px;
      color: #333;
      outline: none;
    }

    input[type="file"].full-input {
      padding-top: 8px;
    }

    #roiList {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
      background: #fafafa;
    }

    .empty-msg {
      color: #888;
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
    }

    .roi-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .roi-item:last-child {
      margin-bottom: 0;
    }

    .roi-item:hover {
      background: #f7faf9;
    }

    .roi-item.selected {
      border-color: #0b8484;
      background: #eef7f6;
    }

    .roi-name {
      font-size: 13px;
      font-weight: bold;
      color: #222;
    }

    .roi-coordinate {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }

    .roi-btn-group {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
      margin-top: 24px;
    }

    .json-box {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: #21252b;
      color: #abb2bf;
      border-radius: 8px;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }

    .back-link {
      display: inline-block;
      color: #666;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .back-link:hover {
      color: #0b8484;
    }

    @media (max-width: 900px) {
      .roi-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- 1. 상단 네비게이션 바 (dashboard.html 규격 적용) -->
  <header class="navbar">
    <div class="logo">
      <a href="main.html">
        <img src="/zzonggeut/src/main/resources/static/assets/logo.png" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html">대시보드</a>
      <a href="activity-report.html">리포트</a>
    </nav>
    <div class="nav-utils">
      <button class="icon-btn" id="alarmBtn">🔔</button>
      <button class="icon-btn" id="profileBtn">👤</button>
      <select class="pet-select">
        <option value="1">우리 강아지 🐶</option>
        <option value="2">우리 고양이 🐱</option>
      </select>
    </div>
  </header>

  <!-- 2. 메인 컨테이너 (중앙 정렬) -->
  <main class="dashboard-container">

    <a href="dashboard.html" class="back-link">← 대시보드로 돌아가기</a>

    <div class="roi-page-header">
      <h2 class="roi-page-title">🎯 관심영역(ROI) 설정</h2>
      <span class="badge live-badge">카메라: CAM-001</span>
    </div>

    <div class="roi-grid">

      <!-- 좌측: 비디오 & 캔버스 카드 -->
      <section class="dash-card">
        <div class="video-wrapper">
          <video id="video" controls muted></video>
          <canvas id="roiCanvas"></canvas>
        </div>
        <div class="instruction">
          💡 영상 위에서 마우스로 드래그하여 영역을 지정하세요. 기존 영역을 클릭하면 선택할 수 있습니다.
        </div>
      </section>

      <!-- 우측: 설정 컨트롤 카드 -->
      <section class="dash-card">
        <div class="form-section">
          <label class="form-label">영상 소스 선택/업로드</label>
          <input type="file" id="videoInput" class="full-input" accept="video/*">
        </div>

        <div class="form-section">
          <label class="form-label">지정할 영역 이름</label>
          <select id="roiType" class="full-input">
            <option value="WATER_BOWL">물그릇 (WATER_BOWL)</option>
            <option value="FOOD_BOWL">밥그릇 (FOOD_BOWL)</option>
            <option value="BED">침대 (BED)</option>
          </select>
        </div>

        <div class="form-section">
          <label class="form-label">
            지정된 영역 목록 (<span id="roiCount" class="primary-text font-bold">0</span>개)
          </label>
          <div id="roiList">
            <div class="empty-msg">아직 지정된 영역이 없습니다.</div>
          </div>
        </div>

        <div class="roi-btn-group">
          <button class="btn btn-sm" id="deleteButton">선택 삭제</button>
          <button class="btn primary-btn" id="saveButton">설정 저장하기</button>
        </div>

        <pre id="jsonBox" class="json-box"></pre>
      </section>

    </div>

  </main>

  <!-- 3. 하단 푸터 (dashboard.html 규격 적용) -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 쫑긋. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const video = document.getElementById("video");
    const videoInput = document.getElementById("videoInput");
    const canvas = document.getElementById("roiCanvas");
    const ctx = canvas.getContext("2d");

    const roiType = document.getElementById("roiType");
    const roiList = document.getElementById("roiList");
    const roiCount = document.getElementById("roiCount");

    const deleteButton = document.getElementById("deleteButton");
    const saveButton = document.getElementById("saveButton");
    const jsonBox = document.getElementById("jsonBox");

    let rois = [];
    let selectedROI = null;
    let drawing = false;
    let startX = 0;
    let startY = 0;

    videoInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      video.src = url;
      video.load();
    });

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      drawROI();
    }

    window.addEventListener("resize", resizeCanvas);
    video.addEventListener("loadedmetadata", resizeCanvas);

    function getMousePosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height
      };
    }

    canvas.addEventListener("mousedown", function (event) {
      const pos = getMousePosition(event);
      const clickedROI = findROI(pos.x, pos.y);

      if (clickedROI) {
        selectedROI = clickedROI;
        updateROIList();
        drawROI();
        return;
      }

      drawing = true;
      startX = pos.x;
      startY = pos.y;
    });

    canvas.addEventListener("mousemove", function (event) {
      if (!drawing) return;

      const pos = getMousePosition(event);
      drawROI();

      ctx.strokeStyle = "#0b8484";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
      ctx.setLineDash([]);
    });

    canvas.addEventListener("mouseup", function (event) {
      if (!drawing) return;
      drawing = false;

      const pos = getMousePosition(event);
      const x = Math.min(startX, pos.x);
      const y = Math.min(startY, pos.y);
      const width = Math.abs(pos.x - startX);
      const height = Math.abs(pos.y - startY);

      if (width < 10 || height < 10) {
        drawROI();
        return;
      }

      const selectedOption = roiType.options[roiType.selectedIndex];
      const roi = {
        id: Date.now(),
        name: roiType.value,
        label: selectedOption.text,
        x: x,
        y: y,
        width: width,
        height: height
      };

      rois.push(roi);
      selectedROI = roi;
      updateROIList();
      drawROI();
    });

    function findROI(x, y) {
      for (let i = rois.length - 1; i >= 0; i--) {
        const roi = rois[i];
        if (x >= roi.x && x <= roi.x + roi.width && y >= roi.y && y <= roi.y + roi.height) {
          return roi;
        }
      }
      return null;
    }

    function drawROI() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      rois.forEach(function (roi) {
        if (roi === selectedROI) {
          ctx.strokeStyle = "#0b8484";
          ctx.fillStyle = "rgba(11, 132, 132, 0.25)";
        } else {
          ctx.strokeStyle = "#4db6ac";
          ctx.fillStyle = "rgba(77, 182, 172, 0.15)";
        }

        ctx.lineWidth = 2;
        ctx.fillRect(roi.x, roi.y, roi.width, roi.height);
        ctx.strokeRect(roi.x, roi.y, roi.width, roi.height);

        ctx.fillStyle = "#0b8484";
        ctx.font = "bold 13px Pretendard, sans-serif";
        ctx.fillText(roi.label, roi.x + 6, roi.y + 18);
      });
    }

    function updateROIList() {
      roiCount.textContent = rois.length;
      roiList.innerHTML = "";

      if (rois.length === 0) {
        roiList.innerHTML = '<div class="empty-msg">아직 지정된 영역이 없습니다.</div>';
        return;
      }

      rois.forEach(function (roi) {
        const item = document.createElement("div");
        item.className = "roi-item";

        if (roi === selectedROI) {
          item.classList.add("selected");
        }

        const ratio = convertToRatio(roi);

        item.innerHTML = `
          <div>
            <div class="roi-name">${roi.label}</div>
            <div class="roi-coordinate">
              x: ${ratio.x} · y: ${ratio.y} · w: ${ratio.width} · h: ${ratio.height}
            </div>
          </div>
        `;

        item.addEventListener("click", function () {
          selectedROI = roi;
          updateROIList();
          drawROI();
        });

        roiList.appendChild(item);
      });
    }

    function convertToRatio(roi) {
      return {
        x: Number((roi.x / canvas.width).toFixed(6)),
        y: Number((roi.y / canvas.height).toFixed(6)),
        width: Number((roi.width / canvas.width).toFixed(6)),
        height: Number((roi.height / canvas.height).toFixed(6))
      };
    }

    deleteButton.addEventListener("click", function () {
      if (!selectedROI) {
        alert("삭제할 영역을 먼저 선택해주세요.");
        return;
      }

      rois = rois.filter(roi => roi !== selectedROI);
      selectedROI = null;
      updateROIList();
      drawROI();
    });

    function createJSON() {
      return {
        camera_id: "CAM-001",
        video: videoInput.files[0] ? videoInput.files[0].name : null,
        rois: rois.map(function (roi) {
          const ratio = convertToRatio(roi);
          return {
            id: roi.id,
            name: roi.name,
            x: ratio.x,
            y: ratio.y,
            width: ratio.width,
            height: ratio.height
          };
        })
      };
    }

    saveButton.addEventListener("click", function () {
      const data = createJSON();
      console.log("ROI JSON:", JSON.stringify(data, null, 4));

      jsonBox.textContent = JSON.stringify(data, null, 4);
      jsonBox.style.display = "block";

      alert("ROI 설정이 저장되었습니다.");
    });

    resizeCanvas();
  </script>
</body>

</html>
