<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개발자에게 문의하기 - 쫑긋</title>
  
  <style>
    /* ===============================
       쫑긋 - 공통 및 문의 페이지 스타일
       =============================== */
    :root {
      --primary: #0b8484;
      --primary-dark: #086868;
      --primary-light: #e6f4f4;
      --cream: #fdfaf5;
      --text: #2c2c2c;
      --text-sub: #6b6b6b;
      --text-light: #9a9a9a;
      --line: #eeeae4;
      --radius: 16px;
      --shadow: 0 6px 28px rgba(45, 40, 30, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background-color: var(--cream);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }

    /* ---------- Header / Navbar ---------- */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 48px;
      background: rgba(253, 250, 245, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .logo-img {
      height: 32px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      font-size: 15px;
      color: var(--text-sub);
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-utils {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .icon-btn:hover {
      background-color: var(--line);
    }

    .pet-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background-color: var(--primary);
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }

    .pet-btn:hover {
      background-color: var(--primary-dark);
    }

    /* ---------- Main / Contact Form ---------- */
    .contact-container {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
    }

    .contact-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow);
    }

    .contact-header {
      margin-bottom: 28px;
      text-align: center;
    }

    .contact-header h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .contact-header p {
      font-size: 14px;
      color: var(--text-sub);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-group .required {
      color: #e53e3e;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background-color: #fafafa;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
      background-color: #fff;
    }

    textarea.form-control {
      height: 120px;
      resize: vertical;
    }

    .form-agree {
      margin-bottom: 24px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .outline-btn {
      background-color: #ffffff;
      color: var(--text-sub);
      border: 1px solid var(--line);
      display: inline-block;
      line-height: 1.5;
    }

    .outline-btn:hover {
      background-color: #f5f5f5;
    }

    .primary-btn {
      background-color: var(--primary);
      color: #ffffff;
    }

    .primary-btn:hover {
      background-color: var(--primary-dark);
    }

    /* ---------- Footer ---------- */
    .footer {
      background: #ffffff;
      border-top: 1px solid var(--line);
      padding: 24px;
      text-align: center;
      margin-top: auto;
    }

    .footer-bottom {
      font-size: 12px;
      color: var(--text-light);
    }

    @media (max-width: 640px) {
      .navbar {
        padding: 14px 20px;
      }
      .contact-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo">
      <a th:href="@{/main}">
        <img th:src="@{/assets/logo.png}" alt="쫑긋 로고" class="logo-img">
      </a>
    </div>
    <nav class="nav-links">
      <a th:href="@{/dashboard}">대시보드</a>
      <a th:href="@{/report}">리포트</a>
    </nav>
    <div class="nav-utils">
      <button class="icon-btn" id="alarmBtn">🔔</button>
      <a th:href="@{/mypage}" class="icon-btn" id="profileBtn" style="text-decoration: none;">👤</a>
      <a th:href="@{/pet-management}" class="pet-btn">내 반려동물</a>
    </div>
  </header>

  <!-- 메인 문의하기 영역 -->
  <main class="contact-container">
    <div class="contact-card">
      <div class="contact-header">
        <h2>개발자에게 문의하기 💬</h2>
        <p>서비스 이용 중 궁금하신 점이나 개선 의견을 남겨주시면 빠르게 답변드리겠습니다.</p>
      </div>

      <form id="contactForm">
        <!-- 이름 -->
        <div class="form-group">
          <label for="userName">이름 <span class="required">*</span></label>
          <input type="text" id="userName" name="userName" class="form-control" placeholder="홍길동" required>
        </div>

        <!-- 이메일 주소 -->
        <div class="form-group">
          <label for="userEmail">이메일 주소 <span class="required">*</span></label>
          <input type="email" id="userEmail" name="userEmail" class="form-control" placeholder="example@email.com" required>
        </div>

        <!-- 휴대폰 번호 -->
        <div class="form-group">
          <label for="userPhone">휴대폰 번호 <span class="required">*</span></label>
          <input type="tel" id="userPhone" name="userPhone" class="form-control" placeholder="010-1234-5678" pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}" required>
        </div>

        <!-- 문의 내용 -->
        <div class="form-group">
          <label for="userMessage">문의 내용 <span class="required">*</span></label>
          <textarea id="userMessage" name="userMessage" class="form-control" placeholder="문의하실 내용을 자세히 작성해주세요." required></textarea>
        </div>

        <!-- 개인정보 수집 동의 -->
        <div class="form-agree">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" required>
            <span>[필수] 개인정보 수집 및 이용에 동의합니다.</span>
          </label>
        </div>

        <!-- 버튼 영역 -->
        <div class="form-actions">
          <a th:href="@{/main}" class="btn outline-btn">취소</a>
          <button type="submit" class="btn primary-btn">문의 보내기</button>
        </div>
      </form>
    </div>
  </main>

  <!-- 하단 푸터 -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 쫑긋. All rights reserved.</p>
    </div>
  </footer>

  <!-- 전송 완료 안내 스크립트 -->
  <script th:inline="javascript">
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('문의가 성공적으로 접수되었습니다. 빠르게 확인 후 답변해 드리겠습니다!');
      window.location.href = /*[[@{/main}]]*/ '/main';
    });
  </script>

</body>

</html>
