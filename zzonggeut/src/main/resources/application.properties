spring.application.name=zzonggeut
server.port=9090

# MySQL 연결
spring.datasource.url=jdbc:mysql://project-db-campus.smhrd.com:3312/cd_26K_HI1_p2_1?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=cd_26K_HI1_p2_1
spring.datasource.password=smhrd1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 작성한 대소문자/언더바 형태를 그대로 DB 컬럼명으로 매핑 (물리 명명 전략을 기본 표준으로 변경)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Thymeleaf 캐시 끄기 (개발 중 실시간 반영)
spring.thymeleaf.cache=false

# 로그 출력
logging.level.web=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# 단일 파일 최대 크기 (예: 200MB)
spring.servlet.multipart.max-file-size=200MB

# 1회 요청 전체(폼 데이터 + 파일) 최대 크기 (예: 200MB)
spring.servlet.multipart.max-request-size=200MB