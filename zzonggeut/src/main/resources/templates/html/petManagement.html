<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반려동물 관리 - 쫑긋</title>
    <link rel="stylesheet" href="../css/dashboardStyle.css">
    <style>
        /* 반려동물 관리 전용 스타일 추가 */
        .pet-manage-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        /* 좌측 목록 스타일 */
        .pet-list-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pet-item-card {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .pet-item-card:hover {
            border-color: #0b8484;
        }

        .pet-item-card.active {
            border-color: #0b8484;
            background-color: #eef7f6;
        }

        .pet-item-name {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin-bottom: 4px;
        }

        .pet-item-desc {
            font-size: 13px;
            color: #666;
        }

        .pet-btn-group {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-full {
            width: 100%;
            padding: 12px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-row .btn {
            flex: 1;
        }

        /* 우측 상세정보 입력 폼 스타일 */
        .form-section-title {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .form-control {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #0b8484;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* 라디오 / 체크박스 인라인 그룹 */
        .radio-group {
            display: flex;
            gap: 16px;
            align-items: center;
            height: 40px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .radio-label input[type="radio"],
        .radio-label input[type="checkbox"] {
            accent-color: #0b8484;
            width: 16px;
            height: 16px;
        }

        /* 예방접종 1~3차 박스 스타일 */
        .vaccine-container {
            display: flex;
            gap: 12px;
            background-color: #f9fbfb;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .vaccine-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
            flex: 1;
        }

        .vaccine-item span {
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }

        .vaccine-options {
            display: flex;
            gap: 10px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #eee;
            color: #555;
            border: none;
        }
    </style>
</head>

<body>

    <!-- 1. 상단 네비게이션 바 -->
    <header class="navbar">
        <div class="logo">
            <a href="main.html">
                <img src="../assets/logo.png" alt="쫑긋 로고" class="logo-img">
            </a>
        </div>

        <nav class="nav-links">
            <a href="dashboard.html">대시보드</a>
            <a href="activity-report.html">리포트</a>
        </nav>

        <div class="nav-utils">
            <button class="icon-btn" id="alarmBtn">🔔</button>
            <button class="icon-btn" id="profileBtn">👤</button>
            <a href="pet-management.html" class="btn primary-btn"
                style="text-decoration: none; padding: 8px 16px; font-size: 14px;">내 반려동물</a>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="dashboard-container">

        <div class="pet-manage-grid">

            <!-- [좌측] 1. 등록 반려동물 목록 & 관리 버튼 -->
            <aside class="dash-card">
                <div class="card-header">
                    <h3>🐾 등록 반려동물 목록</h3>
                </div>

                <div class="pet-list-section">
                    <!-- 신규 입력 모드 또는 단일 등록 상태 예시 -->
                    <div class="pet-item-card active">
                        <div class="pet-item-name">새 반려동물 입력</div>
                        <div class="pet-item-desc">정보를 입력해주세요</div>
                    </div>
                </div>

                <div class="pet-btn-group">
                    <!-- 5. 반려동물 등록 버튼 -->
                    <button class="btn primary-btn btn-full">+ 반려동물 등록</button>

                    <!-- 6. 수정/삭제 버튼 -->
                    <div class="btn-row">
                        <button class="btn outline-btn">수정</button>
                        <button class="btn btn-secondary">삭제</button>
                    </div>
                </div>
            </aside>

            <!-- [우측] 2~4. 반려동물 상세 정보 및 사전정보 입력 폼 -->
            <section class="dash-card">
                <div class="card-header">
                    <h3>📋 반려동물 상세 정보</h3>
                </div>

                <form id="petDetailForm">

                    <!-- 2. 기본 정보 영역 -->
                    <h4 class="form-section-title">📌 기본 정보</h4>
                    <div class="form-grid-3">
                        <div class="form-group">
                            <label for="petName">이름</label>
                            <input type="text" id="petName" class="form-control" placeholder="예: 몽이">
                        </div>

                        <div class="form-group">
                            <label for="petType">종 (분류)</label>
                            <select id="petType" class="form-control">
                                <option value="" disabled selected>선택하세요 (예: 강아지)</option>
                                <option value="dog">강아지</option>
                                <option value="cat">고양이</option>
                                <option value="other">기타</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="petGender">성별</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="gender" value="male"> 수컷
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="gender" value="female"> 암컷
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="petAge">나이 (세)</label>
                            <input type="number" id="petAge" class="form-control" placeholder="예: 3">
                        </div>

                        <div class="form-group">
                            <label for="petWeight">몸무게 (kg)</label>
                            <input type="number" id="petWeight" class="form-control" step="0.1" placeholder="예: 5.2">
                        </div>
                    </div>

                    <!-- 3. 특이사항 / 중성화 / 예방접종 영역 -->
                    <h4 class="form-section-title">🏥 건강 및 상태 정보</h4>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>중성화 여부</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="neutered" value="yes"> 완료
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="neutered" value="no"> 미완료
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 예방접종 1~3차 O/X 선택 영역 -->
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label>예방접종 여부</label>
                        <div class="vaccine-container">
                            <!-- 1차 접종 -->
                            <div class="vaccine-item">
                                <span>1차 : </span>
                                <div class="vaccine-options">
                                    <label class="radio-label">
                                        <input type="radio" name="vaccine1" value="O"> O
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="vaccine1" value="X"> X
                                    </label>
                                </div>
                            </div>
                            <!-- 2차 접종 -->
                            <div class="vaccine-item">
                                <span>2차 : </span>
                                <div class="vaccine-options">
                                    <label class="radio-label">
                                        <input type="radio" name="vaccine2" value="O"> O
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="vaccine2" value="X"> X
                                    </label>
                                </div>
                            </div>
                            <!-- 3차 접종 -->
                            <div class="vaccine-item">
                                <span>3차 : </span>
                                <div class="vaccine-options">
                                    <label class="radio-label">
                                        <input type="radio" name="vaccine3" value="O"> O
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="vaccine3" value="X"> X
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 24px;">
                        <label for="specialNotes">특이사항 (알레르기, 지병 등)</label>
                        <input type="text" id="specialNotes" class="form-control" placeholder="예: 닭고기 알레르기 유, 소리에 민감함">
                    </div>

                    <!-- 4. 사전정보 (글자 입력) 영역 -->
                    <h4 class="form-section-title">📝 사전 정보 (생활환경 및 참고사항)</h4>
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label for="preInfo">평소 생활환경 및 행동 특징</label>
                        <textarea id="preInfo" class="form-control"
                            placeholder="예: 평소 거실 소파 밑에서 휴식하는 것을 좋아하며, 외부인 방문 시 약 10분간 경계하는 편입니다."></textarea>
                    </div>

                    <!-- 하단 저장 버튼 -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary">취소</button>
                        <button type="submit" class="btn primary-btn">저장하기</button>
                    </div>

                </form>
            </section>

        </div>

    </main>

    <!-- 하단 푸터 -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>© 2026 쫑긋. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
